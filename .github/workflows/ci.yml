name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: manifest and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the pinned set (requirements-ci.txt) needs 3.12: numpy 2.5 does
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      # the manifest is generated: rebuilding it (every structure, stereo,
      # site and Atlas identity re-checked) must reproduce the committed file
      - run: python build_manifest.py molecules.yaml
      - run: git diff --exit-code molecules.yaml
      - run: python -m pytest -q tests
